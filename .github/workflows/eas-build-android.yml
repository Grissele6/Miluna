name: Build APK (EAS · Android · preview)

# Manual only. Ve a la pestaña "Actions" del repo y aprieta "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    name: EAS build (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Link or create EAS project under the token's account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # If app.json already carries an extra.eas.projectId, `eas init`
          # is unnecessary; if it does not, `eas init --non-interactive --force`
          # either links to an existing project with the same slug/owner
          # under the authenticated account, or creates a fresh one, and
          # writes the projectId back into app.json for this run.
          if node -e "const c=require('./app.json'); process.exit(c.expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already present in app.json — skipping eas init."
          else
            eas init --non-interactive --force
          fi

      - name: Run EAS build (Android · preview · APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # --non-interactive: no preguntas, --wait: espera al build,
          # --json: sale JSON con la URL del APK al terminar.
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > build.json
          echo "--- build.json ---"
          cat build.json

      - name: Extract APK link
        if: success()
        run: |
          APK_URL=$(node -e "const b=require('./build.json'); const r=Array.isArray(b)?b[0]:b; console.log(r.artifacts?.buildUrl || r.artifacts?.applicationArchiveUrl || '');")
          BUILD_PAGE=$(node -e "const b=require('./build.json'); const r=Array.isArray(b)?b[0]:b; const acc=r.project?.ownerAccount?.name; const slug=r.project?.slug; console.log((acc && slug) ? 'https://expo.dev/accounts/'+acc+'/projects/'+slug+'/builds/'+r.id : '');")
          {
            echo "## 📱 Miluna APK listo"
            echo ""
            if [ -n "$APK_URL" ]; then
              echo "**Descarga directa del APK:** $APK_URL"
              echo ""
              echo "Abre este link desde tu Android para instalarlo. (Puede que tengas que permitir \"instalar desde fuentes desconocidas\".)"
            else
              echo "El build terminó, pero no encontré la URL del APK en la salida. Revisa el detalle acá:"
            fi
            echo ""
            if [ -n "$BUILD_PAGE" ]; then
              echo "**Detalle del build:** $BUILD_PAGE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-metadata
          path: build.json
          if-no-files-found: ignore
